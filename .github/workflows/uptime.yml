name: Uptime

# Every 15 minutes: is the live server answering and ready, and have customers
# hit failures (AI, voice, speech, database, texts, client systems) in the last
# 15 minutes? A failed run sends GitHub's failure email to the repository owner
# (Settings → Notifications → Actions). The full end-to-end check runs daily in
# production-check.yml.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Server answers and is ready
        id: ready
        run: |
          for i in 1 2 3; do
            body=$(curl -sf -m 20 https://visual-assist-7viw.onrender.com/api/health) && echo "$body" | grep -q '"ready":true' && echo "$body" > health.json && echo "OK" && exit 0
            sleep 20
          done
          echo "The live server did not answer as ready three times in a row." && exit 1
      - name: No customer-facing failures in the last 15 minutes
        run: |
          python3 - <<'PY'
          import json, sys
          h = json.load(open("health.json"))
          a = h.get("alerts") or {"total": 0, "byName": {}}
          print("Failures in the last 15 minutes:", a["total"], a["byName"])
          if h.get("status") == "degraded":
              print("Database writes are failing:", h["store"].get("lastError")); sys.exit(1)
          # Three or more in 15 minutes is a pattern, not a blip.
          if a["total"] >= 3:
              print("Customers are likely affected. Check Render logs for these names."); sys.exit(1)
          PY
