name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (server edition)
        run: npm run build
      - name: Build (static demo edition)
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (static demo edition, no base path)
        run: npm run build:static
      - run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t visual-assist:ci .
      - name: Start container and check health
        run: |
          docker run -d --name va -p 3000:3000 -e AUTH_SECRET=ci-secret-0123456789abcdefghijklmnop visual-assist:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:3000/api/health?probe=live"; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/
          docker logs va | tail -20
