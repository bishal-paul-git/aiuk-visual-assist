name: Test feedback
description: Tell us what you found while testing Visual Assist
title: "[Test] "
labels: ["test-feedback"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected. Paste a screenshot if you can.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
